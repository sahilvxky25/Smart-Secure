<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UNO Q Dashboard</title>
<style>
  body { font-family: Arial, sans-serif; background:#1a1a2e; color:#eee;
         display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .card { background:#16213e; border-radius:12px; padding:32px 48px; text-align:center; min-width:280px; }
  .value { font-size:2rem; font-weight:bold; color:#e94560; margin:8px 0 24px; }
  button { background:#e94560; border:none; color:#fff; padding:10px 24px; border-radius:8px; cursor:pointer; font-size:1rem; }
</style>
</head>
<body>
  <div class="card">
    <p>Analog A0</p>
    <p class="value" id="analog">--</p>
    <p>LED</p>
    <p class="value" id="led">--</p>
    <button onclick="toggleLed()">Toggle LED</button>
  </div>
<script>
  function refresh() {
    fetch('/api/status').then(r => r.json()).then(d => {
      document.getElementById('analog').textContent = d.analog;
      document.getElementById('led').textContent = d.led;
    });
  }
  function toggleLed() {
    fetch('/api/led/toggle', { method: 'POST' }).then(refresh);
  }
  setInterval(refresh, 1000);
  refresh();
</script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes</title>
<style>
:root{--bg:#fff;--side:#f4f5f7;--ink:#1f2328;--mute:#7a828c;--line:#e3e6ea;--hover:#e9ebef;--acc:#2f5fd0;--call:#eef3fd;--code:#f1f3f5;color-scheme:light}
:root[data-t=dark]{--bg:#191b1f;--side:#202328;--ink:#e6e8eb;--mute:#8b939d;--line:#2d3138;--hover:#2a2e35;--acc:#7ea2f4;--call:#232b3d;--code:#262a31;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#191b1f;--side:#202328;--ink:#e6e8eb;--mute:#8b939d;--line:#2d3138;--hover:#2a2e35;--acc:#7ea2f4;--call:#232b3d;--code:#262a31;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:5px;padding:2px 6px}button:hover{background:var(--hover)}
#side{width:272px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none;height:100%;overflow:hidden}
#side header{padding:12px 10px 4px;display:flex;gap:6px}
#q{flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:inherit;font:inherit;font-size:14px}
#nav{flex:1;overflow:auto;padding:6px 6px 12px;font-size:14px}
.sec{color:var(--mute);font-size:12px;padding:12px 8px 4px;font-weight:600}
.row{display:flex;align-items:center;gap:2px;padding:3px 4px;border-radius:5px;cursor:pointer;white-space:nowrap}
.row:hover,.row.on{background:var(--hover)}.row.on{font-weight:600}
.row .t{flex:1;overflow:hidden;text-overflow:ellipsis}.row .act{visibility:hidden;font-size:13px}.row:hover .act{visibility:visible}
.row .tg{width:18px;text-align:center;color:var(--mute);font-size:11px;flex:none}
#side footer{border-top:1px solid var(--line);padding:6px;display:flex;gap:4px;font-size:14px}
#main{flex:1;min-width:0;overflow:auto;height:100%}
#bar{position:sticky;top:0;background:var(--bg);display:flex;gap:6px;align-items:center;padding:8px 14px;z-index:5;font-size:14px;color:var(--mute)}
#bar .sp{flex:1}#menu{display:none}
#doc{max-width:760px;margin:0 auto;padding:30px 48px 40vh}
#icon{font-size:56px;cursor:pointer;line-height:1.1;display:inline-block}
#title{width:100%;border:0;outline:0;background:none;color:inherit;font-size:40px;font-weight:700;line-height:1.2;font-family:inherit;padding:6px 0 14px}
.blk{display:flex;gap:6px;align-items:flex-start;position:relative;padding:2px 0}
.blk .x{position:absolute;left:-30px;top:3px;visibility:hidden;color:var(--mute);font-size:13px}.blk:hover .x{visibility:visible}
.mk{flex:none;min-width:22px;text-align:center;color:var(--mute);user-select:none}
.ce{flex:1;outline:0;min-height:1.55em;white-space:pre-wrap;word-break:break-word}
.ce:empty:focus::before{content:attr(data-ph);color:var(--mute);opacity:.7}
.h1 .ce{font-size:1.9em;font-weight:700;line-height:1.3;margin-top:.7em}.h2 .ce{font-size:1.5em;font-weight:700;line-height:1.3;margin-top:.5em}.h3 .ce{font-size:1.2em;font-weight:600;line-height:1.3;margin-top:.3em}
.quote .ce{border-left:3px solid var(--ink);padding-left:12px}
.code .ce{font:13.5px/1.6 ui-monospace,Menlo,Consolas,monospace;background:var(--code);padding:12px 14px;border-radius:6px}
.callout{background:var(--call);border-radius:6px;padding:10px 12px}
.todo.done .ce{text-decoration:line-through;color:var(--mute)}
hr{border:0;border-top:1px solid var(--line);margin:10px 0;flex:1}
#slash{position:fixed;display:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #0003;padding:4px;width:230px;max-height:300px;overflow:auto;z-index:20;font-size:14px}
#slash div{padding:6px 8px;border-radius:5px;cursor:pointer}#slash div.on{background:var(--hover)}
.blk .dh{position:absolute;left:-54px;top:2px;visibility:hidden;color:var(--mute);cursor:grab;font-size:15px;user-select:none}.blk:hover .dh{visibility:visible}
.over{box-shadow:0 2px 0 var(--acc)}.row.over{box-shadow:inset 0 0 0 2px var(--acc)}
.image img{max-width:100%;border-radius:6px;display:block}
.tw{flex:1;overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:5px 8px;min-width:90px;text-align:left;outline:0}th{background:var(--side);font-weight:600}.cell:focus{background:var(--call)}
.tb{display:flex;gap:4px;font-size:12px;color:var(--mute);margin-top:4px}
.ce a{color:var(--acc);text-decoration:underline}.ce code{background:var(--code);padding:1px 5px;border-radius:4px;font:.9em ui-monospace,Menlo,monospace}
#cover{height:180px;margin:-30px -48px 16px;background-size:cover}#bar{flex-wrap:wrap}
.tb input,.tb select{font:inherit;font-size:12px;background:var(--bg);color:inherit;border:1px solid var(--line);border-radius:4px;padding:2px 5px;max-width:120px}
#side footer{flex-wrap:wrap}#tpl{font:inherit;font-size:13px;background:var(--bg);color:inherit;border:1px solid var(--line);border-radius:5px}
#auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99}#auth[hidden]{display:none}
#af,#pf{display:flex;flex-direction:column;gap:10px;width:min(340px,86vw)}#af h2,#pf h3{margin:0 0 4px}
#af input,#pf input{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:inherit;font:inherit;width:100%}
#pf label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
#ae,#pe{color:#d1453b;font-size:13px;min-height:1.2em}#pe.ok{color:#2e8b57}
dialog{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:20px}dialog::backdrop{background:#0006}
.btns{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}.pri{background:var(--acc);color:var(--bg);padding:7px 12px}.pri:hover{background:var(--acc);opacity:.9}
#at{color:var(--acc)}
.empty{color:var(--mute);padding:40px 0}
@media(max-width:760px){#side{position:fixed;z-index:30;transform:translateX(-100%);transition:transform .2s;width:84%}body.open #side{transform:none}#menu{display:inline-block}#doc{padding:16px 18px 40vh}#cover{margin:-16px -18px 12px}#title{font-size:30px}.blk .x,.blk .dh{display:none}}
</style></head><body>
<aside id="side">
  <header><input id="q" placeholder="Search" aria-label="Search pages"></header>
  <div id="nav"></div>
  <footer><button id="new">+ New page</button><select id="tpl" title="Template"><option value="">Blank</option><option value="meeting">Meeting notes</option><option value="weekly">Weekly plan</option><option value="project">Project tracker</option></select><button id="trashBtn">Trash</button><button id="acc">Account</button></footer>
</aside>
<div id="main">
  <div id="bar"><button id="menu" aria-label="Menu">☰</button><span id="crumb"></span><span class="sp"></span><span id="st"></span><button id="cov">Cover</button><button id="shr">Share</button><button id="thm" title="Theme">◐</button><button id="fnt" title="Font">Aa</button><button id="exp" title="Download as Markdown">Export</button><button id="dup">Duplicate</button><button id="fav" title="Favorite">☆</button><button id="del" title="Move to trash">Delete</button></div>
  <div id="doc"></div>
</div>
<div id="auth" hidden><form id="af"><h2 id="ah">Sign in</h2><input id="au" placeholder="Username" autocomplete="username" required>
<input id="ap" type="password" placeholder="Password" autocomplete="current-password" required><div id="ae" role="alert"></div>
<button class="pri" id="as">Sign in</button><button type="button" id="at"></button></form></div>
<dialog id="acct"><form id="pf"><h3 id="who"></h3><label>Current password<input type="password" id="po" autocomplete="current-password" required></label>
<label>New password (8+ characters)<input type="password" id="pn" autocomplete="new-password" minlength="8" required></label>
<label>Confirm new password<input type="password" id="pc" autocomplete="new-password" minlength="8" required></label><div id="pe" role="alert"></div>
<div class="btns"><button type="button" id="pcl">Close</button><button type="button" id="pso">Sign out</button><button class="pri">Change password</button></div></form></dialog>
<div id="slash"></div>
<script>
const $=s=>document.querySelector(s);
const api=(u,m='GET',b)=>fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)}).then(r=>{if(r.status===401&&!/^\/api\/(login|register|me)/.test(u))showAuth();return r.json()});
const uid=()=>Math.random().toString(36).slice(2,10);
const TYPES=[['text','Text'],['h1','Heading 1'],['h2','Heading 2'],['h3','Heading 3'],['bullet','Bulleted list'],['number','Numbered list'],['todo','To-do list'],['quote','Quote'],['callout','Callout'],['code','Code'],['divider','Divider'],['image','Image'],['toggle','Toggle'],['table','Table']];
const MD={'#':'h1','##':'h2','###':'h3','-':'bullet','*':'bullet','1.':'number','[]':'todo','>':'quote','```':'code','---':'divider'};
const PH={h1:'Heading 1',h2:'Heading 2',h3:'Heading 3',text:"Type '/' for blocks",code:'Code',toggle:'Toggle title'};
let pages=[],cur=null,showTrash=false,timer,slash=null;
let openSet=new Set(JSON.parse(localStorage.openPages||'[]'));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ttl=p=>p.title||'Untitled';

/* ---------- sidebar ---------- */
function rowHtml(p,d,kids){
  const has=pages.some(x=>x.parent_id===p.id&&!x.trashed);
  return `<div class="row ${cur&&cur.id===p.id?'on':''}" data-id="${p.id}" draggable="true" style="padding-left:${4+d*14}px">
  <span class="tg" data-a="tog">${has?(openSet.has(p.id)?'▾':'▸'):''}</span><span>${esc(p.icon)}</span><span class="t">${esc(ttl(p))}</span>
  <button class="act" data-a="add" title="Add subpage">+</button></div>`+(kids&&openSet.has(p.id)?tree(p.id,d+1):'');
}
const tree=(pid,d)=>pages.filter(p=>!p.trashed&&(p.parent_id||null)===pid&&(pid||!pages.some(x=>x.id===p.parent_id&&!x.trashed)||!p.parent_id)).map(p=>rowHtml(p,d,true)).join('');
function renderNav(){
  const nav=$('#nav');
  if(showTrash){
    nav.innerHTML='<div class="sec">Trash</div>'+(pages.filter(p=>p.trashed).map(p=>`<div class="row" data-id="${p.id}"><span>${esc(p.icon)}</span><span class="t">${esc(ttl(p))}</span><button class="act" data-a="restore">Restore</button><button class="act" data-a="purge">Delete</button></div>`).join('')||'<div class="empty">Trash is empty</div>');
    return;
  }
  const favs=pages.filter(p=>p.favorite&&!p.trashed);
  nav.innerHTML=(favs.length?'<div class="sec">Favorites</div>'+favs.map(p=>rowHtml(p,0,false)).join(''):'')+'<div class="sec" data-root="1">Pages</div>'+(tree(null,0)||'<div class="empty">No pages yet</div>');
}
$('#nav').onclick=async e=>{
  const r=e.target.closest('.row');if(!r)return;const id=r.dataset.id,a=e.target.dataset.a;
  if(a==='tog'){openSet.has(id)?openSet.delete(id):openSet.add(id);localStorage.openPages=JSON.stringify([...openSet]);return renderNav()}
  if(a==='add'){openSet.add(id);localStorage.openPages=JSON.stringify([...openSet]);return createPage(id)}
  if(a==='restore'){await api('/api/pages/'+id,'PATCH',{trashed:false});await load();return renderNav()}
  if(a==='purge'){if(confirm('Delete forever?')){await api('/api/pages/'+id,'DELETE');await load();renderNav()}return}
  if(showTrash)return;
  openPage(id);document.body.classList.remove('open');
};
let st;$('#q').oninput=e=>{clearTimeout(st);st=setTimeout(async()=>{
  const q=e.target.value.trim();if(!q){return renderNav()}
  const rs=await api('/api/search?q='+encodeURIComponent(q));
  $('#nav').innerHTML='<div class="sec">Results</div>'+(rs.map(p=>`<div class="row" data-id="${p.id}"><span>${esc(p.icon)}</span><span class="t">${esc(ttl(p))}</span></div>`).join('')||'<div class="empty">No matches</div>');
},200)};
$('#trashBtn').onclick=()=>{showTrash=!showTrash;$('#trashBtn').textContent=showTrash?'Back':'Trash';renderNav()};
$('#new').onclick=()=>createPage(null);
$('#menu').onclick=()=>document.body.classList.toggle('open');

/* ---------- pages ---------- */
async function load(){pages=await api('/api/pages')}
async function createPage(parent){
  const p=await api('/api/pages','POST',{parent_id:parent,template:parent?'':$('#tpl').value});
  await load();showTrash=false;$('#trashBtn').textContent='Trash';await openPage(p.id);$('#title').focus();
}
async function openPage(id){
  await flush();cur=await api('/api/pages/'+id);localStorage.lastPage=id;hist=[JSON.stringify(cur.blocks)];hi=0;
  renderNav();renderDoc();
}
function renderDoc(){
  if(!cur){$('#doc').innerHTML='<div class="empty">Select a page or create a new one.</div>';return}
  $('#fav').textContent=cur.favorite?'★':'☆';
  const path=[];let p=cur;while(p){path.unshift(p);p=pages.find(x=>x.id===p.parent_id)}
  $('#crumb').textContent=path.map(x=>x.icon+' '+ttl(x)).join(' / ');
  const cv=cur.cover||'';$('#doc').innerHTML=(cv?`<div id="cover" style="background:${cv[0]==='#'?cv:`url(&quot;${esc(cv)}&quot;) center/cover`}"></div>`:'')+`<div id="icon" title="Change icon">${esc(cur.icon)}</div><input id="title" placeholder="Untitled" value="${esc(cur.title)}"><div id="blocks"></div>`;
  $('#icon').onclick=()=>{const i=prompt('Emoji for this page:',cur.icon);if(i){cur.icon=i.trim().slice(0,4);$('#icon').textContent=cur.icon;save();meta()}};
  $('#title').oninput=e=>{cur.title=e.target.value;save();meta()};
  $('#title').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();focusBlock(0)}};
  renderBlocks();
}
function meta(){const p=pages.find(x=>x.id===cur.id);if(p){p.title=cur.title;p.icon=cur.icon}renderNav();
  $('#crumb').textContent=cur.icon+' '+ttl(cur)}
$('#fav').onclick=async()=>{if(!cur)return;cur.favorite=cur.favorite?0:1;await api('/api/pages/'+cur.id,'PATCH',{favorite:cur.favorite});await load();$('#fav').textContent=cur.favorite?'★':'☆';renderNav()};
$('#del').onclick=async()=>{if(!cur)return;await api('/api/pages/'+cur.id,'PATCH',{trashed:true});cur=null;await load();
  const n=pages.find(p=>!p.trashed);n?await openPage(n.id):(renderNav(),renderDoc())};

/* ---------- saving ---------- */
let hist=[],hi=0,ht;
function snapNow(){clearTimeout(ht);const s=JSON.stringify(cur.blocks);if(hist[hi]!==s){hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>100)hist.shift();hi=hist.length-1}}
const words=()=>cur.blocks.reduce((a,b)=>a+(b.text||'').replace(/<[^>]*>/g,' ').trim().split(/\s+/).filter(Boolean).length,0);
function save(){clearTimeout(ht);ht=setTimeout(()=>cur&&snapNow(),400);$('#st').textContent='Saving…';clearTimeout(timer);timer=setTimeout(flush,500)}
async function flush(){
  clearTimeout(timer);timer=null;if(!cur)return;
  await api('/api/pages/'+cur.id,'PATCH',{title:cur.title,icon:cur.icon,blocks:cur.blocks});
  $('#st').textContent='Saved · '+words()+' words';
}

/* ---------- blocks ---------- */
const B=(type='text',text='')=>({id:uid(),type,text,checked:false});
const LISTY=['bullet','number','todo','quote','callout'];
const FLT={};
const imgHtml=b=>b.url?`<img src="${esc(b.url)}" alt="" onerror="this.alt='Image failed to load'">`:'<span class="mk">No image URL</span>';
const tblHtml=(b,i)=>{const R=b.rows||[['']],q=(FLT[b.id]||'').toLowerCase();return `<div class="tw"><table>${R.map((r,y)=>`<tr${y&&q&&!r.join(' ').toLowerCase().includes(q)?' style="display:none"':''}>`+r.map((c,x)=>{const t=y?'td':'th';return `<${t} class="cell" contenteditable="true" data-r="${y}" data-k="${x}" data-b="${i}">${esc(c)}</${t}>`}).join('')+'</tr>').join('')}</table><div class="tb"><input class="flt" placeholder="Filter rows" data-b="${i}" value="${esc(FLT[b.id]||'')}"><select class="srt" data-b="${i}"><option value="">Sort…</option>${R[0].map((h,x)=>`<option value="${x}">${esc(h||'Column '+(x+1))}</option>`).join('')}</select><button data-t="rev" data-b="${i}">↕</button><button data-t="row" data-b="${i}">+ Row</button><button data-t="col" data-b="${i}">+ Column</button><button data-t="drow" data-b="${i}">− Row</button><button data-t="dcol" data-b="${i}">− Column</button></div></div>`};
function renderBlocks(){
  let n=0,hide=null;
  $('#blocks').innerHTML=cur.blocks.map((b,i)=>{
    n=b.type==='number'?n+1:0;const ind=b.indent||0;if(hide!==null&&ind>hide)return '';hide=null;if(b.type==='toggle'&&b.open===false)hide=ind;
    const mk=b.type==='bullet'?'•':b.type==='number'?n+'.':b.type==='todo'?`<input type="checkbox" data-c="${i}" ${b.checked?'checked':''}>`:b.type==='callout'?'💡':b.type==='toggle'?`<b data-o="${i}" style="cursor:pointer">${b.open===false?'▸':'▾'}</b>`:'';
    const body=b.type==='divider'?'<hr>':b.type==='image'?imgHtml(b):b.type==='table'?tblHtml(b,i):`<div class="ce" contenteditable="true" data-i="${i}" data-ph="${PH[b.type]||'List'}">${b.text}</div>`;
    return `<div class="blk ${b.type} ${b.type==='todo'&&b.checked?'done':''}" data-i="${i}" style="margin-left:${ind*24}px"><span class="dh" draggable="true" data-d="${i}" title="Drag to move">⠿</span><button class="x" data-x="${i}" title="Delete block">✕</button>${mk?`<span class="mk">${mk}</span>`:''}${body}</div>`;
  }).join('');
}
function focusBlock(i,end){
  i=Math.max(0,Math.min(i,cur.blocks.length-1));
  const el=$(`.ce[data-i="${i}"]`);if(!el)return;el.focus();
  const r=document.createRange();r.selectNodeContents(el);r.collapse(!end);
  const s=getSelection();s.removeAllRanges();s.addRange(r);
}
function insertAt(i,b,focus=true){cur.blocks.splice(i,0,b);renderBlocks();if(focus)focusBlock(i);save()}
function setType(i,t){
  const b=cur.blocks[i];b.type=t;b.text=t==='divider'?'':'';
  if(t==='image'){const u=prompt('Paste an image URL, or leave empty to upload a file:');if(u)b.url=u.trim();else if(u==='')pickImage().then(x=>{b.url=x;renderBlocks();save()})}if(t==='table')b.rows=[['Name','Tag','Notes'],['','',''],['','','']];if(['divider','image','table'].includes(t)){cur.blocks.splice(i+1,0,B());renderBlocks();focusBlock(i+1)}else{renderBlocks();focusBlock(i)}
  save();
}
const idx=el=>+el.closest('[data-i]').dataset.i;
const atStart=el=>{const r=getSelection().getRangeAt(0);if(!r.collapsed)return false;const p=document.createRange();p.selectNodeContents(el);p.setEnd(r.startContainer,r.startOffset);return p.toString()===''};
const atEnd=el=>{const r=getSelection().getRangeAt(0);if(!r.collapsed)return false;const p=document.createRange();p.selectNodeContents(el);p.setStart(r.endContainer,r.endOffset);return p.toString()===''};
const tidy=h=>h.replace(/(<br>)+$/,'');

const bl=$('#doc');
bl.addEventListener('input',e=>{
  if(e.target.classList.contains('flt')){FLT[cur.blocks[+e.target.dataset.b].id]=e.target.value;const q=e.target.value.toLowerCase();e.target.closest('.tw').querySelectorAll('tr').forEach((tr,y)=>{if(y)tr.style.display=!q||tr.textContent.toLowerCase().includes(q)?'':'none'});return}
  const cell=e.target.closest('.cell');if(cell){cur.blocks[+cell.dataset.b].rows[+cell.dataset.r][+cell.dataset.k]=cell.textContent;save();return}
  const el=e.target.closest('.ce');if(!el)return;const i=idx(el),b=cur.blocks[i];
  const txt=el.textContent.replace(/\u00a0/g,' ');
  if(b.type==='text'&&MD[txt.trim()]&&/ $/.test(txt)&&txt.trim()!=='---'||b.type==='text'&&txt==='---'||b.type==='text'&&txt==='```'){
    return setType(i,MD[txt.trim()])}
  b.text=tidy(el.innerHTML);save();
  if(b.type==='text'&&txt.startsWith('/'))showSlash(el,i,txt.slice(1));else hideSlash();
});
bl.addEventListener('change',e=>{if(e.target.classList.contains('srt')){const R=cur.blocks[+e.target.dataset.b].rows,k=+e.target.value;if(e.target.value!==''){const hd=R.shift();R.sort((a,b)=>(a[k]||'').localeCompare(b[k]||'',undefined,{numeric:true}));R.unshift(hd);renderBlocks();save()}return}if(e.target.dataset.c!=null){const b=cur.blocks[+e.target.dataset.c];b.checked=e.target.checked;e.target.closest('.blk').classList.toggle('done',b.checked);save()}});
bl.addEventListener('click',e=>{const tt=e.target.dataset.t;if(tt&&e.target.dataset.b!=null){const R=cur.blocks[+e.target.dataset.b].rows;
  if(tt==='rev'){const hd=R.shift();R.reverse();R.unshift(hd)}if(tt==='row')R.push(R[0].map(()=>''));if(tt==='col')R.forEach(r=>r.push(''));if(tt==='drow'&&R.length>1)R.pop();if(tt==='dcol'&&R[0].length>1)R.forEach(r=>r.pop());renderBlocks();save();return}
  const an=e.target.closest&&e.target.closest('a');if(an&&(e.ctrlKey||e.metaKey)){window.open(an.href,'_blank','noopener');return}
  const o=e.target.dataset.o;if(o!=null){const tb=cur.blocks[+o];tb.open=tb.open===false;renderBlocks();save();return}
  const x=e.target.dataset.x;if(x!=null){cur.blocks.splice(+x,1);if(!cur.blocks.length)cur.blocks.push(B());renderBlocks();save()}});
bl.addEventListener('keydown',e=>{
  const cl=e.target.closest('.cell');if(cl){if(e.key==='Enter')e.preventDefault();if(e.key==='Tab'){e.preventDefault();const all=[...cl.closest('table').querySelectorAll('.cell')],n=all[all.indexOf(cl)+(e.shiftKey?-1:1)];n&&n.focus()}return}
  const el=e.target.closest('.ce');if(!el)return;const i=idx(el),b=cur.blocks[i];
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='e'){e.preventDefault();const t=getSelection().toString();if(t)document.execCommand('insertHTML',false,'<code>'+esc(t)+'</code>');return}
  if(mod&&e.shiftKey&&e.key.toLowerCase()==='k'){e.preventDefault();const u=prompt('Link URL:');if(u&&/^https?:\/\//.test(u))document.execCommand('createLink',false,u);return}
  if(slash){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();slash.sel=(slash.sel+(e.key==='ArrowDown'?1:-1)+slash.items.length)%slash.items.length;drawSlash();return}
    if(e.key==='Enter'){e.preventDefault();const t=slash.items[slash.sel];hideSlash();if(t)setType(i,t[0]);return}
    if(e.key==='Escape'){hideSlash();return}
  }
  if(e.key==='Tab'){e.preventDefault();b.indent=Math.max(0,Math.min(4,(b.indent||0)+(e.shiftKey?-1:1)));renderBlocks();focusBlock(i,true);save();return}
  if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){
    e.preventDefault();const j=i+(e.key==='ArrowUp'?-1:1);if(j<0||j>=cur.blocks.length)return;
    [cur.blocks[i],cur.blocks[j]]=[cur.blocks[j],cur.blocks[i]];renderBlocks();focusBlock(j,true);save();return}
  if(e.key==='Enter'&&!e.shiftKey&&b.type!=='code'){
    e.preventDefault();
    if(LISTY.includes(b.type)&&!el.textContent.trim()){b.type='text';b.text='';renderBlocks();focusBlock(i);save();return}
    const r=getSelection().getRangeAt(0),t=document.createRange();t.selectNodeContents(el);t.setStart(r.endContainer,r.endOffset);
    const d=document.createElement('div');d.appendChild(t.extractContents());
    b.text=tidy(el.innerHTML);
    const nb=B(['bullet','number','todo'].includes(b.type)?b.type:'text',tidy(d.innerHTML));nb.indent=(b.indent||0)+(b.type==='toggle'&&b.open!==false?1:0);insertAt(i+1,nb);
    focusBlock(i+1);return}
  if(e.key==='Backspace'&&atStart(el)){
    if(b.type!=='text'){e.preventDefault();b.type='text';renderBlocks();focusBlock(i);save();return}
    if(i>0){e.preventDefault();const p=cur.blocks[i-1];
      if(['divider','image','table'].includes(p.type)){cur.blocks.splice(i-1,1);renderBlocks();focusBlock(i-1)}
      else{const len=p.text;p.text=tidy(len)+b.text;cur.blocks.splice(i,1);renderBlocks();
        const pe=$(`.ce[data-i="${i-1}"]`);focusBlock(i-1,true);
        const rg=document.createRange();rg.selectNodeContents(pe);rg.collapse(false);
        // place caret at join point
        const w=document.createTreeWalker(pe,NodeFilter.SHOW_TEXT);let rem=pe.textContent.length-(b.text.replace(/<[^>]*>/g,'').length),nd;
        while(nd=w.nextNode()){if(rem<=nd.length){rg.setStart(nd,rem);rg.collapse(true);break}rem-=nd.length}
        getSelection().removeAllRanges();getSelection().addRange(rg)}
      save()}return}
  if(e.key==='ArrowUp'&&atStart(el)&&i>0){e.preventDefault();focusBlock(i-1,true)}
  if(e.key==='ArrowDown'&&atEnd(el)&&i<cur.blocks.length-1){e.preventDefault();focusBlock(i+1)}
});
bl.addEventListener('paste',e=>{e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');if(/^https?:\/\/\S+$/.test(t.trim())&&getSelection().toString())document.execCommand('createLink',false,t.trim());else document.execCommand('insertText',false,t)});
bl.addEventListener('mousedown',e=>{ // click empty area below last block -> focus end
  if(e.target.id==='doc'){e.preventDefault();const l=cur.blocks.length-1;if(cur.blocks[l].text||!$(`.ce[data-i="${l}"]`))insertAt(l+1,B());else focusBlock(l)}});

/* ---------- drag to reorder blocks ---------- */
let dragI=null;const clr=()=>document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
bl.addEventListener('dragstart',e=>{const d=e.target.dataset&&e.target.dataset.d;if(d==null)return;dragI=+d;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','')});
bl.addEventListener('dragover',e=>{if(dragI==null)return;e.preventDefault();clr();const k=e.target.closest('.blk');k&&k.classList.add('over')});
bl.addEventListener('drop',e=>{if(dragI==null)return;e.preventDefault();const k=e.target.closest('.blk');if(k){const [m]=cur.blocks.splice(dragI,1);cur.blocks.splice(+k.dataset.i,0,m);renderBlocks();save()}dragI=null;clr()});
bl.addEventListener('dragend',()=>{dragI=null;clr()});

/* ---------- drag pages to nest ---------- */
let dragP=null;const nv=$('#nav');
const isSelfOrDesc=(a,b)=>{let p=pages.find(x=>x.id===b);while(p){if(p.id===a)return true;p=pages.find(x=>x.id===p.parent_id)}return false};
nv.addEventListener('dragstart',e=>{const r=e.target.closest&&e.target.closest('.row');if(r&&!showTrash){dragP=r.dataset.id;e.dataTransfer.setData('text/plain','')}});
nv.addEventListener('dragover',e=>{if(!dragP)return;const t=e.target.closest('.row,.sec[data-root]');if(t){e.preventDefault();clr();t.classList.add('over')}});
nv.addEventListener('drop',async e=>{if(!dragP)return;const t=e.target.closest('.row,.sec[data-root]');clr();if(!t){dragP=null;return}
  const to=t.dataset.id||null;if(!to||!isSelfOrDesc(dragP,to)){await api('/api/pages/'+dragP,'PATCH',{parent_id:to});if(to){openSet.add(to);localStorage.openPages=JSON.stringify([...openSet])}await load();renderNav();if(cur)renderDoc()}dragP=null});
nv.addEventListener('dragend',()=>{dragP=null;clr()});

/* ---------- export, duplicate, shortcuts ---------- */
$('#exp').onclick=async()=>{if(!cur)return;await flush();location.href='/api/pages/'+cur.id+'/export.md'};
$('#dup').onclick=async()=>{if(!cur)return;await flush();const p=await api('/api/pages/'+cur.id+'/duplicate','POST');await load();await openPage(p.id)};
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.body.classList.add('open');$('#q').focus()}});

/* ---------- undo/redo, uploads, cover, share, theme ---------- */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if((e.metaKey||e.ctrlKey)&&!e.altKey&&(k==='z'||k==='y')&&cur&&document.activeElement.closest&&document.activeElement.closest('#blocks')){
    e.preventDefault();const ai=idx(document.activeElement);snapNow();const j=hi+((k==='y'||e.shiftKey)?1:-1);
    if(j<0||j>=hist.length)return;hi=j;cur.blocks=JSON.parse(hist[j]);renderBlocks();focusBlock(ai,true);save()}});
const fi=document.createElement('input');fi.type='file';fi.accept='image/*';
const pickImage=()=>new Promise(res=>{fi.onchange=async()=>{const f=fi.files[0];fi.value='';if(!f)return res('');const fd=new FormData();fd.append('file',f);
  const r=await fetch('/api/upload',{method:'POST',body:fd}).then(r=>r.json());if(r.error)alert(r.error);res(r.url||'')};fi.click()});
$('#cov').onclick=async()=>{if(!cur)return;const v=prompt('Cover: image URL, a #hex colour, "upload" to choose a file, or empty to remove',cur.cover||'');if(v===null)return;
  const c=v.trim()==='upload'?await pickImage():v.trim();await api('/api/pages/'+cur.id,'PATCH',{cover:c});cur.cover=(await api('/api/pages/'+cur.id)).cover||'';renderDoc()};
$('#shr').onclick=async()=>{if(!cur)return;await flush();const r=await api('/api/pages/'+cur.id+'/share','POST');
  if(r.share){const u=location.origin+'/s/'+r.share;try{await navigator.clipboard.writeText(u)}catch(_){}prompt('Public read-only link. Click Share again to stop sharing:',u)}else alert('Sharing turned off.')};
const root=document.documentElement;root.dataset.t=localStorage.theme||'';document.body.style.fontFamily=localStorage.font||'';
$('#thm').onclick=()=>{const n={'':'dark',dark:'light',light:''}[root.dataset.t||''];localStorage.theme=n;root.dataset.t=n};
const FONTS=['','Georgia,serif','ui-monospace,Menlo,monospace'];
$('#fnt').onclick=()=>{const n=FONTS[(FONTS.indexOf(localStorage.font||'')+1)%3];localStorage.font=n;document.body.style.fontFamily=n};

/* ---------- auth & account ---------- */
let reg=false,me={};
async function showAuth(){
  me=await fetch('/api/me').then(r=>r.json());if(me.user){location.reload();return}
  if(me.first)reg=true;$('#auth').hidden=false;drawAuth();
}
function drawAuth(){
  $('#ah').textContent=reg?(me.first?'Create the first account':'Create account'):'Sign in';
  $('#as').textContent=reg?'Create account':'Sign in';$('#ap').autocomplete=reg?'new-password':'current-password';
  $('#at').textContent=reg?'I already have an account':'Create an account';$('#at').hidden=me.first||(!reg&&!me.signup);$('#ae').textContent='';
}
$('#at').onclick=()=>{reg=!reg;drawAuth()};
$('#af').onsubmit=async e=>{e.preventDefault();$('#ae').textContent='';
  const r=await api(reg?'/api/register':'/api/login','POST',{username:$('#au').value,password:$('#ap').value});
  r.error?$('#ae').textContent=r.error:location.reload()};
$('#acc').onclick=()=>{$('#who').textContent='Signed in as '+me.user;$('#pf').reset();$('#pe').textContent='';$('#acct').showModal()};
$('#pcl').onclick=()=>$('#acct').close();
$('#pso').onclick=async()=>{await flush();await api('/api/logout','POST');location.reload()};
$('#pf').onsubmit=async e=>{e.preventDefault();const pe=$('#pe');pe.className='';
  if($('#pn').value!==$('#pc').value){pe.textContent='New passwords do not match';return}
  const r=await api('/api/password','POST',{old:$('#po').value,new:$('#pn').value});
  if(r.error){pe.textContent=r.error;return}
  $('#pf').reset();pe.className='ok';pe.textContent='Password changed. Other devices were signed out.'};
(async()=>{me=await fetch('/api/me').then(r=>r.json());me.user?boot():showAuth()})();

/* ---------- slash menu ---------- */
function showSlash(el,i,q){
  const items=TYPES.filter(t=>t[1].toLowerCase().includes(q.toLowerCase())||t[0].includes(q.toLowerCase()));
  if(!items.length)return hideSlash();
  const r=el.getBoundingClientRect(),m=$('#slash');
  slash={items,sel:0};m.style.display='block';m.style.left=Math.min(r.left,innerWidth-240)+'px';
  m.style.top=Math.min(r.bottom+4,innerHeight-310)+'px';drawSlash();
}
function drawSlash(){const m=$('#slash');m.innerHTML=slash.items.map((t,k)=>`<div class="${k===slash.sel?'on':''}" data-t="${t[0]}">${t[1]}</div>`).join('')}
function hideSlash(){slash=null;$('#slash').style.display='none'}
$('#slash').onmousedown=e=>{e.preventDefault();const t=e.target.dataset.t;if(!t)return;const i=idx(document.activeElement);hideSlash();setType(i,t)};

/* ---------- boot ---------- */
async function boot(){
  await load();
  const last=localStorage.lastPage,first=pages.find(p=>p.id===last&&!p.trashed)||pages.find(p=>!p.trashed);
  first?await openPage(first.id):(renderNav(),renderDoc());
}
addEventListener('beforeunload',()=>{if(cur&&timer)navigator.sendBeacon&&fetch('/api/pages/'+cur.id,{method:'PATCH',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify({title:cur.title,icon:cur.icon,blocks:cur.blocks})})});

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/style.css">
<title>StreamBox</title>
</head>
<body>
<div id="login" class="ov" hidden>
  <div class="box" style="max-width:360px;padding:26px">
    <h1 class="logo" style="font-size:28px;margin-bottom:16px">STREAMBOX</h1>
    <input id="ln" placeholder="Username" autocomplete="username" maxlength="20">
    <input id="lp" type="password" placeholder="Password (optional)" autocomplete="current-password">
    <p id="lerr"></p>
    <button class="btn p" data-a="signin">Sign in</button><button class="btn s" id="suBtn" data-a="signup">Create account</button>
  </div>
</div>

<nav>
  <span class="logo">STREAMBOX</span>
  <div id="sw"><input id="q" type="search" placeholder="Search  ( / )" autocomplete="off"><div id="sg" hidden></div></div>
  <button id="hbtn" title="Watch history">🕘</button><button id="sur" title="Surprise me">🎲</button><button id="gear" title="Settings">⚙</button><span id="av"></span>
</nav>
<header class="hero" id="hero"></header>
<div id="tb"><div id="chips"></div>
  <select id="sort"><option value="rows">Browse</option><option value="new">Newest</option><option value="az">A–Z</option><option value="old">Oldest</option><option value="long">Longest</option><option value="year">Year</option></select>
</div>
<main id="rows"></main>

<div id="modal" class="ov" hidden><div class="box" id="mc"></div></div>
<div id="page" class="ov" hidden><div class="box" id="pgc"></div></div>
<div id="settings" class="ov" hidden><div class="box" id="sc"></div></div>

<div id="player" class="ov" hidden>
  <div id="pb">
    <button id="x">✕</button><b id="pt"></b>
    <button id="pv">⏮</button><button id="b10">⟲ 10</button><button id="f10">10 ⟳</button><button id="skip">Skip 85s</button><button id="nx">⏭</button>
    <button id="ccb">CC</button><button id="pip">PiP</button>
    <select id="qual" title="Quality"><option value="orig">Original</option><option value="auto">Auto</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option><option value="360">360p</option></select>
    <select id="aud" title="Audio track" hidden></select>
    <select id="rate"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select>
    <select id="sleep" title="Sleep timer"><option value="0">Sleep: off</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">60 min</option></select>
  </div>
  <video id="v" controls autoplay playsinline></video><div id="err"></div>
  <div id="up" hidden><p>Up next: <b id="upt"></b> in <span id="upc">6</span>s</p><br><button class="btn p" id="upn">Play now</button><button class="btn s" id="upx">Cancel</button></div>
</div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>window.Hls||document.write('<script src="/js/hls.min.js"><\/script>')</script>
<script src="/js/util.js"></script>
<script src="/js/search.js"></script>
<script src="/js/reco.js"></script>
<script src="/js/extras.js"></script>
<script src="/js/player.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
